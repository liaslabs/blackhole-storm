# Uploads the leaderboard server (server/worker.js) to Cloudflare. Run it by hand: Actions -> "Sunucuyu yayınla" -> Run workflow.
# One-time setup: the repository secret CLOUDFLARE_API_TOKEN (the account id is in server/wrangler.toml). See server/README.md.
name: Sunucuyu yayınla

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cloudflare anahtarı var mı
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret'ı eksik. server/README.md -> 'Telefondan yükleme' bölümüne bak."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sunucuyu yükle
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy

      - name: Kontrol
        run: |
          sleep 5
          curl -fsS https://blackhole-storm-lb.liaslabs-games.workers.dev/ | tee /dev/stderr | grep -q '"ok":true'
          echo "### Sunucu yüklendi ✓" >> "$GITHUB_STEP_SUMMARY"
