# Uploads the leaderboard server (server/worker.js) to Cloudflare. Run it by hand: Actions -> "Sunucuyu yayınla" -> Run workflow.
# One-time setup: the repository secret CLOUDFLARE_API_TOKEN (the account id is in server/wrangler.toml). See server/README.md.
# Optional secrets GP_SA and GP_PKG turn on purchase checks (see GOOGLE_PLAY.md, section 5e).
name: Sunucuyu yayınla

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cloudflare anahtarı var mı
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret'ı eksik. server/README.md -> 'Telefondan yükleme' bölümüne bak."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sunucuyu yükle
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy

      # Optional: Google Play keys for purchase checks (POST /verify) and Play Integrity. Set the repository secrets
      # GP_SA (the service account's JSON key) and GP_PKG (com.liaslabs.blackholestorm); they are copied to Cloudflare here.
      - name: Google Play anahtarlarını aktar (varsa)
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GP_SA: ${{ secrets.GP_SA }}
          GP_PKG: ${{ secrets.GP_PKG }}
        run: |
          if [ -n "$GP_SA" ]; then printf '%s' "$GP_SA" | npx --yes wrangler@4 secret put GP_SA; echo "GP_SA aktarıldı"; else echo "GP_SA yok (satın alma doğrulaması kapalı)"; fi
          if [ -n "$GP_PKG" ]; then printf '%s' "$GP_PKG" | npx --yes wrangler@4 secret put GP_PKG; echo "GP_PKG aktarıldı"; fi

      - name: Kontrol
        run: |
          sleep 5
          curl -fsS https://blackhole-storm-lb.liaslabs-games.workers.dev/ | tee /dev/stderr | grep -q '"ok":true'
          echo "### Sunucu yüklendi ✓" >> "$GITHUB_STEP_SUMMARY"
