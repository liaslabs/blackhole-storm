# Publishes the game to GitHub Pages: https://<owner>.github.io/blackhole-storm/
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Web sitesini yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Site klasörünü hazırla
        run: |
          mkdir -p _site
          cp index.html privacy.html manifest.webmanifest sw.js intro.mp4 _site/
          cp -r icons music _site/
          mkdir -p _site/store && cp store/screenshot-*.jpg _site/store/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
