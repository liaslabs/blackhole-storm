<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Can kaybı önerileri</title>
<style>
body{margin:0;background:#0a0a14;font-family:'IBM Plex Sans Condensed',system-ui,sans-serif;color:#fff}
.row{display:flex;gap:10px;padding:10px}
.cell{flex:none;text-align:center}
.cell h3{margin:2px 0 6px;font-size:13px;letter-spacing:.08em;color:#ffd76a}
.ph{position:relative;width:390px;height:844px;background:url(can-bg.png) 0 0/390px 844px;overflow:hidden;border-radius:18px;zoom:.5}
.ph *{position:absolute}
svg.h{width:100%;height:100%;left:0;top:0;overflow:visible}
.t{left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:800;letter-spacing:.14em;text-shadow:0 2px 6px #000}
:root{--T:2.8s}
/* 0: today */
.c0 .card{left:50%;top:47%;transform:translate(-50%,-50%);text-align:center;animation:c0 var(--T) ease-out infinite;opacity:0}
.c0 .card b{position:static;display:block;font-size:44px;font-weight:900;color:#ff5a4a;text-shadow:0 0 24px rgba(255,60,50,.8),0 3px 0 rgba(0,0,0,.6)}
.c0 .card div{position:static;font-size:15px;font-weight:800;letter-spacing:.14em;text-shadow:0 2px 6px #000}
.c0 .pop{left:174px;top:520px;font-weight:900;color:#ff7a5c;font-size:20px;animation:pop var(--T) linear infinite;opacity:0}
@keyframes c0{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}6%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}11%{transform:translate(-50%,-50%) scale(1)}38%{opacity:1}48%,100%{opacity:0;transform:translate(-50%,-60%)}}
@keyframes pop{0%{opacity:1;transform:none}36%{opacity:0;transform:translateY(-40px)}100%{opacity:0}}
/* A: broken heart */
.cA .hw{left:145px;top:300px;width:100px;height:100px}
.cA .L{animation:aL var(--T) ease-in infinite}.cA .R{animation:aR var(--T) ease-in infinite}
@keyframes aL{0%{opacity:0;transform:scale(.4)}7%{opacity:1;transform:scale(1.1)}12%{transform:scale(1)}20%{transform:none}42%{opacity:1;transform:translate(-26px,40px) rotate(-24deg)}52%,100%{opacity:0;transform:translate(-34px,70px) rotate(-30deg)}}
@keyframes aR{0%{opacity:0;transform:scale(.4)}7%{opacity:1;transform:scale(1.1)}12%{transform:scale(1)}20%{transform:none}42%{opacity:1;transform:translate(26px,40px) rotate(24deg)}52%,100%{opacity:0;transform:translate(34px,70px) rotate(30deg)}}
.cA .t1{top:415px;font-size:17px;animation:fadeT var(--T) ease-out infinite;opacity:0}
.cA .t2{top:445px;font-size:13px;color:#ffb3a8;letter-spacing:.1em;animation:fadeT var(--T) ease-out infinite;opacity:0}
@keyframes fadeT{0%,8%{opacity:0;transform:translate(-50%,6px)}16%{opacity:1;transform:translate(-50%,0)}44%{opacity:1}54%,100%{opacity:0}}
/* B: hearts in a row, the last one cracks and goes grey */
.cB .t1{top:330px;font-size:15px;animation:fadeT var(--T) ease-out infinite;opacity:0}
.cB .hr{left:50%;top:360px;width:210px;height:60px;transform:translateX(-50%);animation:fadeR var(--T) ease-out infinite;opacity:0}
.cB .hr .s{top:0;width:56px;height:56px}.cB .s1{left:0}.cB .s2{left:77px}.cB .s3{left:154px;animation:bShake var(--T) linear infinite}
.cB .s3 .full{animation:bDrain var(--T) linear infinite}
.cB .sh{left:28px;top:28px;width:9px;height:9px;background:#ff5a5f;clip-path:polygon(50% 0,100% 100%,0 70%);opacity:0;animation:shard var(--T) ease-out infinite}
@keyframes fadeR{0%,4%{opacity:0;transform:translateX(-50%) scale(.85)}10%{opacity:1;transform:translateX(-50%) scale(1)}46%{opacity:1}56%,100%{opacity:0}}
@keyframes bShake{0%,14%{transform:none}16%{transform:translate(-4px,1px) rotate(-6deg)}18%{transform:translate(4px,-1px) rotate(6deg)}20%{transform:translate(-3px,0) rotate(-4deg)}22%,100%{transform:none}}
@keyframes bDrain{0%,20%{opacity:1;filter:none}26%{opacity:1;filter:brightness(2)}34%,100%{opacity:0}}
@keyframes shard{0%,21%{opacity:0;transform:none}23%{opacity:1}40%{opacity:0;transform:translate(var(--x),var(--y)) rotate(200deg)}100%{opacity:0}}
/* C: the heart falls into your black hole */
.cC .fly{left:304px;top:15px;width:26px;height:26px;animation:cFly var(--T) cubic-bezier(.5,0,.8,.6) infinite;opacity:0}
@keyframes cFly{0%{opacity:0;transform:none}4%{opacity:1;transform:scale(1.6)}10%{transform:scale(1.5)}38%{opacity:1;transform:translate(-118px,520px) scale(.9) rotate(320deg)}46%{opacity:0;transform:translate(-118px,524px) scale(.1) rotate(620deg)}100%{opacity:0}}
.cC .ring{left:155px;top:512px;width:80px;height:80px;border-radius:50%;border:3px solid #ff5a5f;opacity:0;animation:cRing var(--T) ease-out infinite}
@keyframes cRing{0%,38%{opacity:0;transform:scale(.3)}41%{opacity:.9}60%,100%{opacity:0;transform:scale(2.4)}}
.cC .ban{left:50%;top:70px;transform:translateX(-50%);padding:7px 14px;border-radius:999px;background:rgba(20,10,14,.82);border:1px solid rgba(255,90,95,.6);font-size:13px;font-weight:800;letter-spacing:.1em;white-space:nowrap;animation:ban var(--T) ease-out infinite;opacity:0}
.cC .ban i,.cD .ban i{position:static;font-style:normal;color:#ffb3a8;font-weight:700;letter-spacing:.04em}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-10px)}8%{opacity:1;transform:translate(-50%,0)}48%{opacity:1}58%,100%{opacity:0}}
/* D: quiet: red edge pulse, the HUD heart cracks, a small banner */
.cD .vig{left:0;top:0;width:100%;height:100%;box-shadow:inset 0 0 70px 18px rgba(255,40,50,.75);opacity:0;animation:vig var(--T) ease-out infinite}
@keyframes vig{0%{opacity:0}5%{opacity:1}30%,100%{opacity:0}}
.cD .hud{left:304px;top:15px;width:26px;height:26px;animation:dHud var(--T) linear infinite}
.cD .hud .full{animation:bDrain var(--T) linear infinite}
@keyframes dHud{0%{transform:none}4%{transform:scale(1.9)}8%{transform:scale(1.5) rotate(-10deg)}12%{transform:scale(1.5) rotate(10deg)}18%{transform:scale(1.4)}30%,100%{transform:none}}
.cD .sh{left:13px;top:13px;width:8px;height:8px;background:#ff5a5f;clip-path:polygon(50% 0,100% 100%,0 70%);opacity:0;animation:shard var(--T) ease-out infinite}
.cD .ban{left:50%;top:70px;transform:translateX(-50%);padding:7px 14px;border-radius:999px;background:rgba(20,10,14,.82);border:1px solid rgba(255,90,95,.6);font-size:13px;font-weight:800;letter-spacing:.1em;white-space:nowrap;animation:ban var(--T) ease-out infinite;opacity:0}
.hidehud{left:295px;top:12px;width:44px;height:32px;background:#121722;border-radius:6px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<path id="hp" d="M12 21.3s-7.6-4.7-10.1-9.4C.2 8.4 2 4.4 5.9 4c2.3-.2 4 1.1 6.1 3.5C14.1 5.1 15.8 3.8 18.1 4c3.9.4 5.7 4.4 4 7.9C19.6 16.6 12 21.3 12 21.3z"/>
<clipPath id="cl"><polygon points="0,0 13,0 11,6 13.6,9.5 10.6,13.2 13,17 12,24 0,24"/></clipPath>
<clipPath id="cr"><polygon points="13,0 24,0 24,24 12,24 13,17 10.6,13.2 13.6,9.5 11,6"/></clipPath>
<radialGradient id="hg" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#ff9a9c"/><stop offset=".45" stop-color="#ff4a55"/><stop offset="1" stop-color="#c41c33"/></radialGradient>
</defs></svg>
<div class="row">
 <div class="cell c0"><h3>ŞU AN</h3><div class="ph"><div class="card"><b>-1 ♥</b><div>METEOR ÇARPTI</div><div style="color:#ff6b6b;letter-spacing:.2em">♥♥<span style="position:static;opacity:.25">♥</span></div></div><div class="pop">-1 ♥</div></div></div>
 <div class="cell cA"><h3>A · KIRIK KALP</h3><div class="ph">
   <div class="hw"><svg class="h L" viewBox="0 0 24 24" style="filter:drop-shadow(0 0 14px rgba(255,60,70,.8))"><use href="#hp" fill="url(#hg)" clip-path="url(#cl)"/></svg><svg class="h R" viewBox="0 0 24 24" style="filter:drop-shadow(0 0 14px rgba(255,60,70,.8))"><use href="#hp" fill="url(#hg)" clip-path="url(#cr)"/></svg></div>
   <div class="t t1">METEOR ÇARPTI</div><div class="t t2">2 CAN KALDI</div></div></div>
 <div class="cell cB"><h3>B · CAN SIRASI</h3><div class="ph"><div class="t t1">METEOR ÇARPTI</div>
   <div class="hr"><svg class="s s1" viewBox="0 0 24 24"><use href="#hp" fill="url(#hg)"/></svg><svg class="s s2" viewBox="0 0 24 24"><use href="#hp" fill="url(#hg)"/></svg>
   <div class="s s3"><svg class="h" viewBox="0 0 24 24"><use href="#hp" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.2"/></svg><svg class="h full" viewBox="0 0 24 24"><use href="#hp" fill="url(#hg)"/></svg>
   <i class="sh" style="--x:-40px;--y:-34px"></i><i class="sh" style="--x:38px;--y:-30px"></i><i class="sh" style="--x:-30px;--y:36px"></i><i class="sh" style="--x:42px;--y:28px"></i><i class="sh" style="--x:4px;--y:-46px"></i></div></div></div></div>
 <div class="cell cC"><h3>C · DELİĞE DÜŞEN KALP</h3><div class="ph"><div class="hidehud"></div><svg class="fly" viewBox="0 0 24 24" style="filter:drop-shadow(0 0 8px #ff4a55)"><use href="#hp" fill="url(#hg)"/></svg><div class="ring"></div>
   <div class="ban">METEOR ÇARPTI · <i>2 can kaldı</i></div></div></div>
 <div class="cell cD"><h3>D · SESSİZ UYARI</h3><div class="ph"><div class="vig"></div><div class="hidehud"></div>
   <div class="hud"><svg class="h" viewBox="0 0 24 24"><use href="#hp" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.4"/></svg><svg class="h full" viewBox="0 0 24 24"><use href="#hp" fill="url(#hg)"/></svg>
   <i class="sh" style="--x:-26px;--y:22px"></i><i class="sh" style="--x:20px;--y:26px"></i><i class="sh" style="--x:-6px;--y:34px"></i></div>
   <div class="ban">METEOR ÇARPTI</div></div></div>
</div></body></html>
