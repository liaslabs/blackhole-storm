name = "blackhole-storm-lb"
main = "worker.js"
account_id = "87ad941aab047fa5b744aa610abd2de6"   # not a secret: it only says which Cloudflare account the Worker belongs to
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "blackhole-storm"
database_id = "dc0f3d04-51d0-400b-aff3-be53eaa1d586"

# once a day, a few minutes after midnight UTC: settle yesterday's prizes and drop old rows
[triggers]
crons = ["7 0 * * *"]
